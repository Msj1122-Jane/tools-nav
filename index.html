<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>七瑾的工具台</title>
<style>
/* ============ 深蓝主题 ============ */
:root{
  --b1:#081A38; --b2:#0F2B57; --b3:#1B4A8A; --b4:#2563EB; --b5:#3B82F6; --b6:#7FB0F7; --b7:#DBEAFE;
  --bg:#F5F3EE;
  --cards:#FFFFFF;
  --text:#122035;
  --text-2:#465A70;
  --muted:#7B8794;
  --border:rgba(14,31,54,.09);
  --border-strong:rgba(37,99,235,.30);
  --shadow:0 1px 2px rgba(14,31,54,.04);
  --shadow-hover:0 8px 24px rgba(14,31,54,.12);
  --accent:var(--b4);
  --accent-soft:rgba(37,99,235,.09);
  --side-text:#BFD3EC;
  --side-text-dim:#7E97B8;
  --side-active:rgba(59,130,246,.20);
  --side-hover:rgba(255,255,255,.06);
  --sidebar:256px;
}
html[data-theme="dark"]{
  --bg:#09111D;
  --cards:#111D2B;
  --text:#E8F0FA;
  --text-2:#B4C7E0;
  --muted:#7C93AE;
  --border:rgba(255,255,255,.08);
  --border-strong:rgba(96,165,250,.38);
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --shadow-hover:0 10px 28px rgba(0,0,0,.45);
  --accent:var(--b5);
  --accent-soft:rgba(59,130,246,.16);
  --side-text:#C6D8EF;
  --side-active:rgba(59,130,246,.24);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh;
  -webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
}
a{color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(122,143,168,.35);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ============ 左侧导航栏 ============ */
.sidebar{
  position:fixed; left:0; top:0; bottom:0; width:var(--sidebar); z-index:40;
  background:linear-gradient(180deg,var(--b1) 0%,var(--b2) 58%,#0B2447 100%);
  display:flex; flex-direction:column; overflow-y:auto; overscroll-behavior:contain;
  border-right:1px solid rgba(255,255,255,.06);
}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14)}
.brand{
  display:flex; align-items:center; gap:11px; padding:20px 18px 18px;
  border-bottom:1px solid rgba(255,255,255,.07); flex:none;
}
.brand .mark{
  width:36px; height:36px; border-radius:11px; flex:none; display:grid; place-items:center;
  background:linear-gradient(140deg,var(--b4),var(--b6)); color:#fff; font-weight:700; font-size:15px;
  box-shadow:0 6px 16px rgba(37,99,235,.42);
}
.brand h1{margin:0; font-size:14.5px; font-weight:650; color:#fff; letter-spacing:.2px}
.brand p{margin:3px 0 0; font-size:9.5px; color:var(--side-text-dim); letter-spacing:.7px; white-space:nowrap}

.side-group{padding:14px 12px 4px}
.side-label{
  font-size:10.5px; color:var(--side-text-dim); letter-spacing:1.4px;
  padding:0 8px 8px; font-weight:600;
}
.side-item{
  display:flex; align-items:center; gap:10px; width:100%;
  padding:9px 10px; border-radius:9px; border:0; background:transparent; cursor:pointer;
  color:var(--side-text); font-size:13.5px; font-family:inherit; text-align:left;
  transition:background .15s ease,color .15s ease; position:relative;
}
.side-item:hover{background:var(--side-hover); color:#fff}
.side-item.on{background:var(--side-active); color:#fff; font-weight:600}
.side-item.on::before{
  content:''; position:absolute; left:-12px; top:50%; transform:translateY(-50%);
  width:3px; height:18px; border-radius:0 3px 3px 0; background:var(--b5);
}
.side-item .ico{width:17px; height:17px; flex:none; opacity:.9; display:grid; place-items:center}
.side-item .ico svg{width:16px; height:16px; display:block}
.side-item .txt{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.side-item .cnt{
  font-size:11px; color:var(--side-text-dim); font-variant-numeric:tabular-nums;
  background:rgba(255,255,255,.07); padding:1px 6px; border-radius:6px; flex:none;
}
.side-item.on .cnt{color:#DCE9FA; background:rgba(255,255,255,.14)}

/* 两级分类树 */
.side-row{display:flex; align-items:center; gap:1px; position:relative}
.side-row .side-item{flex:1; min-width:0}
.side-caret{
  width:17px; height:24px; flex:none; border:0; background:transparent; cursor:pointer;
  color:var(--side-text-dim); font-size:9px; display:grid; place-items:center;
  transition:transform .18s ease,color .15s; font-family:inherit;
}
.side-caret:hover{color:#fff}
.side-caret.open{transform:rotate(90deg)}
.side-subs{display:none; flex-direction:column; gap:1px; padding:3px 0 5px}
.side-subs.open{display:flex}
.side-sub{
  position:relative; display:flex; align-items:center; gap:8px; width:100%;
  padding:6px 10px 6px 31px; border:0; border-radius:8px; background:transparent; cursor:pointer;
  color:var(--side-text-dim); font-size:12.5px; font-family:inherit; text-align:left;
  transition:background .15s ease,color .15s ease;
}
.side-sub::before{
  content:''; position:absolute; left:17px; top:50%; transform:translateY(-50%);
  width:4px; height:4px; border-radius:50%; background:rgba(255,255,255,.20); transition:.15s
}
.side-sub:hover{background:var(--side-hover); color:#fff}
.side-sub.on{background:var(--side-active); color:#fff; font-weight:600}
.side-sub.on::before{background:var(--b5); box-shadow:0 0 0 3px rgba(59,130,246,.18)}
.side-sub .txt{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.side-sub .cnt{font-size:10.5px; color:var(--side-text-dim); font-variant-numeric:tabular-nums; flex:none}
.side-sub.on .cnt{color:#DCE9FA}
.side-tags{display:flex; flex-wrap:wrap; gap:6px; padding:2px 8px 4px}
.side-tag{
  border:1px solid rgba(255,255,255,.13); background:transparent; color:var(--side-text);
  font-size:11.5px; padding:3px 9px; border-radius:7px; cursor:pointer; font-family:inherit;
  max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; transition:.15s
}
.side-tag:hover{border-color:rgba(127,176,247,.6); color:#fff}
.side-tag.on{background:var(--b5); border-color:transparent; color:#fff; font-weight:600}
.side-more{
  background:transparent; border:0; color:var(--side-text-dim); font-size:11.5px; cursor:pointer;
  padding:4px 8px; font-family:inherit; text-decoration:underline; text-underline-offset:3px
}
.side-more:hover{color:#fff}
.side-foot{
  margin-top:auto; padding:14px 20px 18px; border-top:1px solid rgba(255,255,255,.07);
  color:var(--side-text-dim); font-size:11px; line-height:1.9; flex:none
}
.side-foot b{color:#DCE9FA; font-weight:600}

/* ============ 主区 ============ */
.main{margin-left:var(--sidebar); min-height:100vh; display:flex; flex-direction:column}
.topbar{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:12px; padding:12px 26px;
  background:var(--bg);
  backdrop-filter:saturate(170%) blur(14px); -webkit-backdrop-filter:saturate(170%) blur(14px);
  border-bottom:1px solid var(--border);
}
html[data-theme="light"] .topbar{background:rgba(245,243,238,.88)}
html[data-theme="dark"] .topbar{background:rgba(7,16,31,.86)}
.hamburger{
  display:none; width:34px; height:34px; flex:none; border:1px solid var(--border); border-radius:9px;
  background:var(--cards); color:var(--text-2); cursor:pointer; font-size:15px
}
.crumb{font-size:12.5px; color:var(--muted); white-space:nowrap; flex:none; max-width:230px; overflow:hidden; text-overflow:ellipsis}
.crumb b{color:var(--text); font-weight:650; font-size:13.5px}
.searchbox{position:relative; flex:1; min-width:110px; max-width:520px}
.searchbox input{
  width:100%; height:38px; padding:0 38px 0 36px; font-size:13.5px; font-family:inherit;
  border-radius:10px; border:1px solid var(--border); background:var(--cards); color:var(--text);
  outline:none; transition:.18s
}
.searchbox input::placeholder{color:var(--muted)}
.searchbox input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.searchbox input:focus{border-color:var(--border-strong); box-shadow:0 0 0 3px var(--accent-soft)}
.searchbox .mag{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); display:grid; place-items:center}
.searchbox kbd{
  position:absolute; right:11px; top:50%; transform:translateY(-50%);
  font-family:inherit; font-size:10.5px; color:var(--muted); border:1px solid var(--border);
  border-bottom-width:2px; border-radius:5px; padding:1px 5px
}
.top-actions{display:flex; align-items:center; gap:7px; margin-left:auto; flex:none}
.ibtn{
  height:34px; min-width:34px; padding:0 10px; border-radius:9px; border:1px solid var(--border);
  background:var(--cards); color:var(--text-2); font-size:12.5px; cursor:pointer; font-family:inherit;
  display:inline-flex; align-items:center; gap:5px; transition:.15s
}
.ibtn:hover{border-color:var(--border-strong); color:var(--accent)}
.ibtn.primary{background:linear-gradient(140deg,var(--b4),var(--b5)); color:#fff; border-color:transparent}
.ibtn.primary:hover{filter:brightness(1.1); color:#fff}
.seg{display:flex; border:1px solid var(--border); border-radius:9px; overflow:hidden; background:var(--cards)}
.seg button{
  border:0; background:transparent; padding:7px 10px; font-size:12px; color:var(--muted);
  cursor:pointer; font-family:inherit; transition:.15s
}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on{background:var(--accent-soft); color:var(--accent); font-weight:600}

/* ============ 内容 ============ */
.content{padding:22px 26px 60px; flex:1}
.welcome{
  border-radius:16px; padding:20px 22px; margin-bottom:26px;
  background:linear-gradient(120deg,var(--b1) 0%,var(--b2) 52%,var(--b3) 100%);
  color:#fff; position:relative; overflow:hidden;
}
.welcome::after{
  content:''; position:absolute; right:-60px; top:-70px; width:260px; height:260px; border-radius:50%;
  background:radial-gradient(circle,rgba(127,176,247,.30),transparent 68%);
}
.welcome .hi{font-size:12.5px; color:#9FBCE0; letter-spacing:1.2px}
.welcome h2{margin:8px 0 0; font-size:21px; font-weight:650; letter-spacing:-.2px}
.welcome .desc{margin:9px 0 0; font-size:13px; color:#B9CDE6; line-height:1.6; max-width:640px}
.welcome .nums{display:flex; gap:20px; margin-top:16px; flex-wrap:wrap; position:relative}
.welcome .nums span{font-size:12px; color:#9FBCE0}
.welcome .nums b{font-size:17px; color:#fff; font-weight:650; margin-right:5px; font-variant-numeric:tabular-nums}

.section{margin-bottom:32px}
.sec-head{display:flex; align-items:center; gap:9px; margin:0 0 13px}
.sec-head .dot{width:4px; height:15px; border-radius:3px; background:var(--accent)}
.sec-head h3{margin:0; font-size:15px; font-weight:650; letter-spacing:.1px}
.sec-head .n{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.sec-head .line{flex:1; height:1px; background:var(--border)}
.sec-head .path{font-size:11.5px; color:var(--muted)}

.subhead{display:flex; align-items:center; gap:8px; margin:15px 0 9px}
.subhead .bar{width:2px; height:12px; border-radius:2px; background:var(--b6); flex:none}
.subhead .t{font-size:12.5px; font-weight:600; color:var(--text-2)}
.subhead .n{font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
.subhead .ln{flex:1; height:0; border-top:1px dashed var(--border)}
.subhead:first-child{margin-top:2px}

/* ============ 右侧三级分类 ============ */
.third-nav{
  display:flex;align-items:center;gap:7px;overflow-x:auto;scrollbar-width:none;
  margin:-2px 0 16px;padding:2px 0 10px;border-bottom:1px solid var(--border)
}
.third-nav::-webkit-scrollbar{display:none}
.third-label{flex:none;font-size:11px;color:var(--muted);margin-right:2px}
.third-chip{
  flex:none;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);background:var(--cards);
  color:var(--text-2);border-radius:9px;padding:6px 9px;font:inherit;font-size:11.5px;cursor:pointer;transition:.15s
}
.third-chip b{font-size:10px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.third-chip:hover{border-color:var(--border-strong);color:var(--accent)}
.third-chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:650}
.third-chip.on b{color:var(--accent)}
.third-group{margin:0 0 24px}
.third-group:last-child{margin-bottom:0}
.third-head{display:flex;align-items:center;gap:8px;margin:3px 0 10px}
.third-head .mark{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.third-head .title{font-size:12.5px;font-weight:650;color:var(--text-2)}
.third-head .count{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.third-head .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}

/* ============ 卡片 ============ */
.cards{display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(252px,1fr))}
.card{
  position:relative; display:flex; align-items:center; gap:11px; padding:12px 13px;
  border-radius:13px; background:var(--cards); border:1px solid var(--border);
  box-shadow:var(--shadow); text-decoration:none;
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
  animation:fade .26s ease both;
}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-2px); border-color:var(--border-strong); box-shadow:var(--shadow-hover)}
.card:hover .name{color:var(--accent)}
.logo{
  width:36px; height:36px; flex:none; border-radius:10px; display:grid; place-items:center; overflow:hidden;
  background:linear-gradient(140deg,var(--b6),var(--b7)); color:var(--b2); font-weight:700; font-size:14px;
}
html[data-theme="dark"] .logo{background:linear-gradient(140deg,var(--b3),var(--b2)); color:var(--b7)}
.logo{position:relative}
.logo img{width:100%; height:100%; object-fit:contain; display:block}
.logo img.net{position:absolute; inset:0; background:var(--cards); border-radius:10px}
.cards.list .logo img.net{border-radius:7px}
.info{min-width:0; flex:1}
.name{
  font-size:13.5px; font-weight:600; line-height:1.35; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:color .16s
}
.tip-line{
  font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.45;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis
}
.pin{
  width:24px; height:24px; flex:none; border:0; border-radius:7px; background:transparent;
  color:var(--muted); cursor:pointer; font-size:12px; display:grid; place-items:center;
  opacity:0; transition:.15s; font-family:inherit
}
.card:hover .pin{opacity:1}
.pin:hover{background:var(--accent-soft); color:var(--accent)}
.pin.on{opacity:1; color:#E2A93B}
.rm{
  position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%; border:0;
  background:var(--muted); color:#fff; font-size:11px; cursor:pointer; display:none; place-items:center;
  font-family:inherit; line-height:1
}
.card:hover .rm{display:grid}

/* 列表视图 */
.cards.list{grid-template-columns:1fr; gap:5px}
.cards.list .card{padding:9px 12px; border-radius:10px; box-shadow:none}
.cards.list .card:hover{transform:none}
.cards.list .logo{width:26px; height:26px; border-radius:7px; font-size:12px}
.cards.list .info{display:flex; align-items:center; gap:14px}
.cards.list .name{flex:none; max-width:34%}
.cards.list .tip-line{margin-top:0; flex:1}
.cards.list .pin{width:20px; height:20px}

/* ============ 悬停浮层：功能优势 ============ */
.hovercard{
  position:fixed; z-index:70; width:296px; padding:14px 15px; border-radius:14px;
  background:var(--cards); border:1px solid var(--border);
  box-shadow:0 16px 40px rgba(10,28,56,.22);
  opacity:0; visibility:hidden; transform:translateY(4px); pointer-events:none;
  transition:opacity .16s ease,transform .16s ease,visibility .16s;
}
html[data-theme="dark"] .hovercard{box-shadow:0 16px 40px rgba(0,0,0,.55)}
.hovercard.show{opacity:1; visibility:visible; transform:none}
.hovercard .hc-top{display:flex; align-items:center; gap:9px; margin-bottom:10px}
.hovercard .hc-logo{
  position:relative;
  width:30px; height:30px; border-radius:9px; flex:none; display:grid; place-items:center; overflow:hidden;
  background:linear-gradient(140deg,var(--b6),var(--b7)); color:var(--b2); font-weight:700; font-size:13px
}
html[data-theme="dark"] .hovercard .hc-logo{background:linear-gradient(140deg,var(--b3),var(--b2)); color:var(--b7)}
.hovercard .hc-logo img{width:100%;height:100%;object-fit:contain}
.hovercard .hc-logo img.net{position:absolute; inset:0; background:var(--cards)}
.hovercard .hc-name{font-size:13.5px; font-weight:650; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hovercard .hc-host{font-size:11px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hovercard .hc-adv{
  font-size:12.5px; line-height:1.62; color:var(--text-2);
  padding:9px 11px; border-radius:9px; background:var(--accent-soft); border-left:2px solid var(--accent)
}
.hovercard .hc-adv i{font-style:normal; color:var(--accent); font-weight:600; margin-right:4px}
.hovercard .hc-tags{display:flex; gap:5px; margin-top:10px; flex-wrap:wrap}
.hovercard .hc-tag{
  font-size:10.5px; padding:2px 7px; border-radius:6px; background:var(--accent-soft); color:var(--accent)
}
.hovercard .hc-tag.cat{background:rgba(122,143,168,.14); color:var(--muted)}

/* 空状态 / 页脚 */
.empty{
  text-align:center; padding:56px 20px; color:var(--muted); border:1px dashed var(--border);
  border-radius:16px; background:var(--cards); font-size:13.5px
}
.empty .big{font-size:26px; margin-bottom:10px; opacity:.45}
.foot{
  margin-top:40px; padding-top:16px; border-top:1px solid var(--border);
  font-size:11.5px; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap; align-items:center
}
.foot b{color:var(--text-2); font-weight:600}
.foot kbd{
  font-family:inherit; font-size:10.5px; border:1px solid var(--border); border-bottom-width:2px;
  border-radius:5px; padding:1px 5px
}
.scrim{
  position:fixed; inset:0; z-index:35; background:rgba(6,17,34,.45); backdrop-filter:blur(2px); display:none
}
.scrim.show{display:block}

/* 弹窗 */
.mask{position:fixed; inset:0; z-index:80; background:rgba(6,17,34,.5); display:none; place-items:center; padding:20px}
.mask.show{display:grid}
.modal{
  width:min(460px,100%); background:var(--cards); border:1px solid var(--border); border-radius:17px;
  padding:22px; box-shadow:0 24px 60px rgba(6,17,34,.34); animation:pop .2s ease
}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
.modal h3{margin:0 0 16px; font-size:15.5px; font-weight:650}
.field{margin-bottom:13px}
.field label{display:block; font-size:11.5px; color:var(--muted); margin-bottom:6px}
.field input,.field select{
  width:100%; height:39px; padding:0 12px; border-radius:10px; border:1px solid var(--border);
  background:var(--bg); color:var(--text); font-size:13.5px; font-family:inherit; outline:none
}
.field input:focus,.field select:focus{border-color:var(--border-strong); box-shadow:0 0 0 3px var(--accent-soft)}
.acts{display:flex; gap:9px; justify-content:flex-end; margin-top:18px}
.btn{
  height:37px; padding:0 16px; border-radius:10px; border:1px solid var(--border); background:var(--cards);
  color:var(--text-2); cursor:pointer; font-size:13px; font-family:inherit; transition:.15s
}
.btn:hover{border-color:var(--border-strong); color:var(--accent)}
.btn.ok{background:linear-gradient(140deg,var(--b4),var(--b5)); color:#fff; border-color:transparent}
.btn.ok:hover{filter:brightness(1.1); color:#fff}
.toast{
  position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(16px); z-index:90;
  background:var(--b2); color:#fff; padding:10px 18px; border-radius:11px; font-size:13px;
  box-shadow:0 12px 30px rgba(6,17,34,.34); opacity:0; transition:.24s ease; pointer-events:none
}
.toast.show{opacity:1; transform:translateX(-50%)}

@media (hover:none){ .pin{opacity:1} }

            return x.tag===state.tag && (state.cat==='首页'||state.cat==='全部工具'||state.cat==='★ 收藏'||
                   (x.cat===state.cat && (!state.sub||x.sub===state.sub)));

  /* ---- 过滤 ---- */
  function filtered(){
    var q=state.q.trim().toLowerCase();
    var list=all().filter(function(x){
      if(state.cat==='★ 收藏'){ if(!favs[key(x)]) return false; }
      else if(state.cat!=='首页'&&state.cat!=='全部工具'){
        if(x.cat!==state.cat) return false;
        if(state.sub && x.sub!==state.sub) return false;
      }
      if(state.tag && x.tag!==state.tag) return false;
      if(state.third){
        var scheme=thirdScheme(state.cat,state.sub);
        if(scheme&&thirdNameFor(x,scheme)!==state.third) return false;
      }
      if(q){
        var hay=(x.name+' '+x.tip+' '+x.desc+' '+(x.tag||'')+' '+(x.sub||'')+' '+(x.host||'')+' '+x.url+' '+x.cat).toLowerCase();
        if(hay.indexOf(q)<0) return false;
      }
      return true;
    });
    if(state.sort==='recent') list.sort(function(a,b){ return (b.add||0)-(a.add||0); });
    else if(state.sort==='name') list.sort(function(a,b){ return a.name.localeCompare(b.name,'zh-Hans-CN'); });
    else list.sort(function(a,b){ return (favs[key(b)]?1:0)-(favs[key(a)]?1:0); });
    return list;
  }

  /* ---- 渲染 ---- */
  function cardHTML(x){
    var k=key(x);
    return '<article class="card" data-k="'+esc(k)+'">'+
      '<a class="card-link" href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">'+
        '<div class="logo">'+iconHTML(x)+'</div>'+
        '<div class="info">'+
          '<div class="name">'+esc(x.name)+'</div>'+
          '<div class="tip-line">'+esc(x.tip||x.host||'')+'</div>'+
        '</div>'+
      '</a>'+
      '<div class="card-actions">'+
        '<button class="card-action copy" data-copy="'+esc(k)+'" title="复制链接" aria-label="复制 '+esc(x.name)+' 的链接">⧉</button>'+
        '<button class="card-action info-btn" data-info="'+esc(k)+'" title="查看详情" aria-label="查看 '+esc(x.name)+' 的详情">•••</button>'+
        '<button class="pin'+(favs[k]?' on':'')+'" data-pin="'+esc(k)+'" title="收藏" aria-label="收藏 '+esc(x.name)+'">'+(favs[k]?'★':'☆')+'</button>'+
      '</div>'+
      '<button class="rm" data-rm="'+esc(k)+'" title="删除网站" aria-label="删除 '+esc(x.name)+'">×</button>'+
    '</article>';
  }

  function sectionHTML(g){
    var cls=(state.view==='list'?' list':'');
    var head='<div class="sec-head"><span class="dot"></span>'+
      '<h3>'+esc(g.title)+'</h3>'+
      (g.path?'<span class="path">'+esc(g.path)+'</span>':'')+
      '<span class="n">'+g.items.length+' 个</span><span class="line"></span></div>';
    var body;
    var scheme=thirdScheme(g.path,g.title);
    if(g.third&&scheme){
      body=thirdHTML(g,scheme,cls);
    } else if(g.split){
      var subs=subsOf(g.title), parts='';
      subs.forEach(function(s){
        var arr=g.items.filter(function(x){ return x.sub===s; });
        if(!arr.length) return;
        parts+=subHTML(s,arr,cls);
      });
      var rest=g.items.filter(function(x){ return subs.indexOf(x.sub)<0; });
      if(rest.length) parts+=subHTML('其他',rest,cls);
      body=parts;
    } else {
      body='<div class="cards'+cls+'">'+g.items.map(cardHTML).join('')+'</div>';
    }
    return '<section class="section">'+head+body+'</section>';
  }
  function subHTML(title,arr,cls){
    return '<div class="subhead"><span class="bar"></span><span class="t">'+esc(title)+'</span>'+
      '<span class="n">'+arr.length+'</span><span class="ln"></span></div>'+
      '<div class="cards'+cls+'">'+arr.map(cardHTML).join('')+'</div>';
  }
  function thirdHTML(g,scheme,cls){
    var scope=all().filter(function(x){return x.cat===g.path&&x.sub===g.title;});
    var names=scheme.map(function(x){return x.name;});
    if(scope.some(function(x){return thirdNameFor(x,scheme)==='其他';})) names.push('其他');
    var tabs='';
    if(g.thirdFilter){
      tabs='<div class="third-nav" aria-label="'+esc(g.title)+'三级分类"><span class="third-label">细分</span>'+
        '<button class="third-chip'+(!state.third?' on':'')+'" data-third="">全部 <b>'+scope.length+'</b></button>'+
        names.map(function(name){
          var n=scope.filter(function(x){return thirdNameFor(x,scheme)===name;}).length;
          if(!n) return '';
          return '<button class="third-chip'+(state.third===name?' on':'')+'" data-third="'+esc(name)+'">'+esc(name)+' <b>'+n+'</b></button>';
        }).join('')+'</div>';
    }
    var groups=names.map(function(name){
      var arr=g.items.filter(function(x){return thirdNameFor(x,scheme)===name;});
      if(!arr.length) return '';
      return '<div class="third-group"><div class="third-head"><span class="mark"></span><span class="title">'+esc(name)+'</span>'+
        '<span class="count">'+arr.length+' 个</span><span class="rule"></span></div>'+
        '<div class="cards'+cls+'">'+arr.map(cardHTML).join('')+'</div></div>';
    }).join('');
    return tabs+groups;
  }

  function renderOverview(){
    var counts={}; all().forEach(function(x){counts[x.cat]=(counts[x.cat]||0)+1;});
    overviewEl.innerHTML='<div class="overview-head"><h2>按任务浏览</h2><span>七个入口，快速缩小范围</span></div>'+
      '<div class="cat-overview">'+TREE.map(function(t){
        return '<button class="cat-tile" data-overview="'+esc(t.name)+'">'+
          '<span class="top"><span class="cat-ico">'+iconFor(t.name)+'</span><strong>'+esc(t.name)+'</strong><span class="count">'+(counts[t.name]||0)+'</span></span>'+
          '<p>'+esc(CAT_DESC[t.name]||'')+'</p></button>';
      }).join('')+'</div>';
    Array.prototype.forEach.call(overviewEl.querySelectorAll('[data-overview]'),function(b){
      b.onclick=function(){choose(b.dataset.overview,'');};

  function renderFilterbar(){
    if(!TREE.some(function(t){return t.name===state.cat;})){
      filterbar.classList.remove('show'); filterbar.innerHTML=''; return;
    }
    filterbar.classList.add('show');

      }).join('');

  function render(){
    var fullList=filtered(), list=fullList.slice(0,state.limit), groups=[];
    var home=state.cat==='首页'&&!state.q.trim()&&!state.tag;
    $('#homeIntro').style.display=home?'grid':'none';
    overviewEl.style.display=home?'block':'none';
    document.body.classList.toggle('home-mode',home);

    if(home){
      renderOverview();
      var favList=all().filter(function(x){return !!favs[key(x)];}).slice(0,6);
      var recent=all().slice().sort(function(a,b){return (b.add||0)-(a.add||0);}).slice(0,12);
      if(favList.length) groups.push({title:'我的收藏',path:'常用入口',items:favList,split:false});
      groups.push({title:'最近收录',path:'课程与日常整理',items:recent,split:false});
      list=recent.concat(favList); fullList=list;
    }else if(state.cat==='首页'||state.cat==='全部工具'||state.cat==='★ 收藏'){
      TREE.forEach(function(t){
        var arr=list.filter(function(x){ return x.cat===t.name; });
        if(arr.length) groups.push({ title:t.name, path:'', items:arr, split:true });
      });
      if(!groups.length&&list.length) groups.push({ title:'搜索结果', path:'', items:list, split:true });
    }else if(state.sub){
      groups.push({ title:state.sub, path:state.cat, items:list, split:false, third:!!thirdScheme(state.cat,state.sub), thirdFilter:true });
    }else{
      subsOf(state.cat).forEach(function(s){
        var arr=list.filter(function(x){ return x.sub===s; });
        if(arr.length) groups.push({ title:s, path:state.cat, items:arr, split:false, third:!!thirdScheme(state.cat,s), thirdFilter:false });
      });
      if(!groups.length&&list.length) groups.push({ title:state.cat, path:'', items:list, split:false });
    }

    sectionsEl.innerHTML=groups.map(sectionHTML).join('');
    $('#empty').style.display=fullList.length?'none':'block';
    $('#btnMoreResults').classList.toggle('show',!home&&fullList.length>list.length);
    $('#btnMoreResults').textContent='再显示 '+Math.min(120,fullList.length-list.length)+' 个';
    $('#count').textContent=home?'共收录 '+all().length+' 个工具':'显示 '+list.length+' / '+fullList.length+' 个结果';

    var name=state.sub?state.cat+' › '+state.sub:state.cat;
    if(state.third) name+=' › '+state.third;
    if(state.tag) name+=' · '+state.tag;
    if(state.q.trim()) name+=' · “'+state.q.trim()+'”';
    $('#crumb').innerHTML=(state.cat==='首页'?'<b>'+esc(name)+'</b>':'<button data-crumb-home>工具台</button><span class="sep">/</span><b>'+esc(name)+'</b>');
    var crumbHome=$('[data-crumb-home]'); if(crumbHome) crumbHome.onclick=function(){choose('首页','');};

    var tags={}, nsub={};
    all().forEach(function(x){ if(x.tag) tags[x.tag]=1; if(x.sub) nsub[x.cat+'|'+x.sub]=1; });
    $('#nums').innerHTML=
      '<span><b>'+all().length+'</b>个站点</span>'+
      '<span><b>'+TREE.length+'</b>个任务分类</span>'+
      '<span><b>'+Object.keys(nsub).length+'</b>个子类</span>'+
      '<span><b>'+all().filter(function(x){return !!favs[key(x)];}).length+'</b>个收藏</span>';

    var restoreBtn=$('#btnRestore'), deletedCount=Object.keys(deleted).length;
    restoreBtn.hidden=!deletedCount;
    restoreBtn.textContent='↶ 恢复已删除网站'+(deletedCount?' ('+deletedCount+')':'');

    renderFilterbar(); renderSide(); bindThird(); bindCards();
  }

  function bindThird(){
    Array.prototype.forEach.call(sectionsEl.querySelectorAll('[data-third]'),function(b){
      b.onclick=function(){ state.third=b.dataset.third||''; resetLimit(); hideHover(); render(); };
    });
  }

  function bindCards(){
    Array.prototype.forEach.call(sectionsEl.querySelectorAll('.pin'), function(b){
      b.onclick=function(e){
        e.preventDefault(); e.stopPropagation();
        var k=b.dataset.pin;
        if(favs[k]) delete favs[k]; else favs[k]=1;
        save(LS.fav,Object.keys(favs)); hideHover(); render();
        toast(favs[k]?'已收藏':'已取消收藏');
      };
    });
    Array.prototype.forEach.call(sectionsEl.querySelectorAll('.rm'), function(b){
      b.onclick=function(e){
        e.preventDefault(); e.stopPropagation();
        var src=findByKey(b.dataset.rm); if(src) removeSite(src);
      };
    });
    Array.prototype.forEach.call(sectionsEl.querySelectorAll('.copy'), function(b){
      b.onclick=function(){
        var src=findByKey(b.dataset.copy); if(!src) return;
        if(navigator.clipboard&&navigator.clipboard.writeText){
          navigator.clipboard.writeText(src.url).then(function(){toast('链接已复制');},function(){fallbackCopy(src.url);});
        }else fallbackCopy(src.url);
      };
    });
    Array.prototype.forEach.call(sectionsEl.querySelectorAll('.info-btn'), function(b){
      b.onclick=function(){ var src=findByKey(b.dataset.info); if(src) openDetail(src); };
    });
    Array.prototype.forEach.call(sectionsEl.querySelectorAll('.card'), function(card){
      var k=card.dataset.k;
      var src=null;
      all().some(function(x){ if(key(x)===k){ src=x; return true; } return false; });
      if(!src) return;
      var link=card.querySelector('.card-link');
      link.addEventListener('mouseenter',function(){ showHover(card,src); });
      card.addEventListener('mouseleave',hideHover);
      link.addEventListener('focus',function(){ showHover(card,src); });
      link.addEventListener('blur',hideHover);
    });
  }

  function findByKey(k){
    var out=null; all().some(function(x){if(key(x)===k){out=x;return true;}return false;}); return out;
  }
  function removeSite(x){
    if(!window.confirm('从工具台删除“'+x.name+'”？\n可在“更多 → 恢复已删除网站”中找回内置网站。')) return;
    var k=key(x);
    if(x.local){
      added=added.filter(function(item){return key(item)!==k;});
      save(LS.added,added);
    }else{
      deleted[k]=1; save(LS.deleted,Object.keys(deleted));
    }
    hideHover(); closeDetail(); render(); toast('已删除“'+x.name+'”');
  }
  function fallbackCopy(value){
    var ta=document.createElement('textarea'); ta.value=value; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');toast('链接已复制');}catch(e){toast('复制失败');}
    document.body.removeChild(ta);
  }

  function openDetail(x){

      '<div class="detail-head"><div class="logo">'+iconHTML(x)+'</div><div><h2>'+esc(x.name)+'</h2><div class="detail-host">'+esc(x.host||x.url)+'</div></div></div>'+

      (x.desc&&x.desc!==x.name?'<div class="detail-desc">'+esc(x.desc)+'</div>':'')+
      '<div class="detail-actions"><a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">打开网站 ↗</a><button data-detail-copy>复制链接</button><button data-detail-delete>删除</button></div>';
    var cp=$('[data-detail-copy]'); if(cp) cp.onclick=function(){fallbackCopy(x.url);};

  /* ---- 悬停浮层 ---- */
  var hoverTimer;
  function showHover(card,x){
    clearTimeout(hoverTimer);
    hoverTimer=setTimeout(function(){
      hoverEl.innerHTML=
        '<div class="hc-top">'+
          '<div class="hc-logo">'+iconHTML(x)+'</div>'+
          '<div style="min-width:0;flex:1">'+
            '<div class="hc-name">'+esc(x.name)+'</div>'+
            '<div class="hc-host">'+esc(x.host||'')+'</div>'+
          '</div>'+
        '</div>'+
        (x.tip?'<div class="hc-adv"><i>优势</i>'+esc(x.tip)+'</div>':'')+
        '<div class="hc-tags">'+
          (x.tag?'<span class="hc-tag">'+esc(x.tag)+'</span>':'')+
          '<span class="hc-tag cat">'+esc(x.cat+(x.sub?' › '+x.sub:''))+'</span>'+
          (favs[key(x)]?'<span class="hc-tag">已收藏</span>':'')+
        '</div>';
      hoverEl.classList.add('show');
      var r=card.getBoundingClientRect(), w=hoverEl.offsetWidth, hh=hoverEl.offsetHeight;
      var left=Math.max(12, Math.min(r.left+r.width/2-w/2, window.innerWidth-w-12));

      if(top+hh>window.innerHeight-12) top=Math.max(12, r.top-hh-10);
      hoverEl.style.left=left+'px';
      hoverEl.style.top=top+'px';
    },110);

  function hideHover(){ clearTimeout(hoverTimer); hoverEl.classList.remove('show'); }

  /* ---- 搜索 / 排序 / 视图 ---- */

  }
  fCat.innerHTML=TREE.map(function(t){ return '<option>'+esc(t.name)+'</option>'; }).join('');
  fillSubs(fCat.value);
  fCat.onchange=function(){ fillSubs(fCat.value); };

  $('#btnAdd').onclick=function(){
    moreMenu.classList.remove('show'); moreBtn.setAttribute('aria-expanded','false');
    fCat.value=TREE.some(function(t){return t.name===state.cat;})?state.cat:TREE[0].name;
    fillSubs(fCat.value);
    if(state.sub) fSub.value=state.sub;
    mask.classList.add('show'); $('#fName').focus();
  };
  $('#fCancel').onclick=function(){ mask.classList.remove('show'); };
  mask.onclick=function(e){ if(e.target===mask) mask.classList.remove('show'); };
  $('#fSave').onclick=function(){
    var name=$('#fName').value.trim(), url=$('#fUrl').value.trim();
    if(!name||!url){ toast('名称和链接都要填'); return; }
    if(!/^https?:\/\//i.test(url)) url='https://'+url;
    var host=''; try{ host=new URL(url).host; }catch(e){}
    added.push({ id:'a'+Date.now(), cat:fCat.value, sub:fSub.value, tag:$('#fTag').value.trim(),
      name:name, tip:$('#fTip').value.trim(), desc:name, url:url, host:host, icon:'',
      add:Math.floor(Date.now()/1000), local:true });
    save(LS.added,added);
    $('#fName').value=''; $('#fUrl').value=''; $('#fTag').value=''; $('#fTip').value='';
    mask.classList.remove('show'); render(); toast('已添加');
  };

  /* ---- 导出书签 ---- */
  $('#btnExport').onclick=function(){
    moreMenu.classList.remove('show'); moreBtn.setAttribute('aria-expanded','false');
    var now=Math.floor(Date.now()/1000);
    var out='<!DOCTYPE NETSCAPE-Bookmark-file-1>\n<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">\n<TITLE>Bookmarks</TITLE>\n<H1>Bookmarks</H1>\n<DL><p>\n';
    TREE.forEach(function(t){
      var items=all().filter(function(x){ return x.cat===t.name; });
      if(!items.length) return;
      out+='    <DT><H3 ADD_DATE="'+now+'">'+esc(t.name)+'</H3>\n    <DL><p>\n';
      subsOf(t.name).forEach(function(s){
        var arr=items.filter(function(x){ return x.sub===s; });
        if(!arr.length) return;
        out+='        <DT><H3 ADD_DATE="'+now+'">'+esc(s)+'</H3>\n        <DL><p>\n';
        arr.forEach(function(x){ out+='            <DT><A HREF="'+esc(x.url)+'" ADD_DATE="'+(x.add||now)+'">'+esc(x.name)+'</A>\n'; });
        out+='        </DL><p>\n';
      });
      out+='    </DL><p>\n';
    });
    out+='</DL><p>\n';
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([out],{type:'text/html;charset=utf-8'}));
    a.download='bookmarks_'+(new Date().toISOString().slice(0,10))+'.html';
    a.click(); URL.revokeObjectURL(a.href);
    toast('已导出，可重新导入浏览器');
  };

  /* ---- toast ---- */
  var tTimer;
  function toast(msg){
    var t=$('#toast'); t.textContent=msg; t.classList.add('show');
    clearTimeout(tTimer); tTimer=setTimeout(function(){ t.classList.remove('show'); },1600);
  }

  /* ---- 快捷键 ---- */
  document.addEventListener('keydown',function(e){
    if(e.key==='/' && document.activeElement!==qEl){ e.preventDefault(); qEl.focus(); qEl.select(); }
    else if(document.activeElement===qEl&&(e.key==='ArrowDown'||e.key==='ArrowUp')){
      var cards=Array.prototype.slice.call(sectionsEl.querySelectorAll('.card'));
      if(!cards.length) return;
      e.preventDefault(); cards.forEach(function(c){c.classList.remove('key-focus');});
      searchIndex=(searchIndex+(e.key==='ArrowDown'?1:-1)+cards.length)%cards.length;
      cards[searchIndex].classList.add('key-focus'); cards[searchIndex].scrollIntoView({block:'nearest'});
    }
    else if(document.activeElement===qEl&&e.key==='Enter'){
      var chosen=sectionsEl.querySelector('.card.key-focus .card-link')||sectionsEl.querySelector('.card-link');
      if(chosen){e.preventDefault();chosen.click();}
    }
    else if(e.key==='Escape'){
      if(mask.classList.contains('show')) mask.classList.remove('show');
      else if(detailDrawer.classList.contains('show')) closeDetail();
      else if(sidebar.classList.contains('open')) closeSide();
      else if(moreMenu.classList.contains('show')){moreMenu.classList.remove('show');moreBtn.setAttribute('aria-expanded','false');}
      else if(state.third){ state.third=''; resetLimit(); render(); }
      else { qEl.value=''; state.q=''; resetLimit(); render(); qEl.blur(); }
    }
    else if((e.metaKey||e.ctrlKey)&&e.key==='f'){ e.preventDefault(); qEl.focus(); qEl.select(); }
  });

  render();
})();
</script>
</body>
</html>
